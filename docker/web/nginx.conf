# Serves the Angular production build with SPA fallback and proxies /api to the API container.
# Same shape as scripts/lib/serve-web.mjs, which scripts/test.sh uses outside containers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers from the design's security NFR. Angular's production build has no inline
    # scripts; PrimeNG injects theme styles at runtime, hence 'unsafe-inline' for styles only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://api-maintenance:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # The client router owns unknown paths.
        try_files $uri $uri/ /index.html;
    }
}
